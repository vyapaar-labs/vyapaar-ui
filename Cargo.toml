[workspace]
resolver = "2"
members = [
  "crates/vyapaar-ui-app",
  "crates/vyapaar-ui-core",
  "crates/vyapaar-ui-client",
  "crates/vyapaar-ui-api-wasm",
  "crates/vyapaar-ui-assets",
  "crates/vyapaar-ui-charts",
  "crates/vyapaar-cli",
  "crates/vyapaar-tui",
  "crates/vyapaar-highlight",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/vyapaar-labs/vyapaar-ui"

[workspace.dependencies]
# Vyapaar internal crates
vyapaar-core = { path = "../vyapaar-core" }
# Agent-chat wiring (from upstream) kept for CLI/TUI integration with the
# vyapaar-agent workspace.
vyapaar-agent-core = { path = "../vyapaar-agent/crates/vyapaar-agent-core" }
vyapaar-agent-chat = { path = "../vyapaar-agent/crates/vyapaar-agent-chat" }
vyapaar-agent-llm = { path = "../vyapaar-agent/crates/vyapaar-agent-llm" }
vyapaar-agent-prompt = { path = "../vyapaar-agent/crates/vyapaar-agent-prompt" }
vyapaar-ui-core = { path = "crates/vyapaar-ui-core" }
vyapaar-ui-assets = { path = "crates/vyapaar-ui-assets" }
vyapaar-ui-charts = { path = "crates/vyapaar-ui-charts" }
vyapaar-ui-client = { path = "crates/vyapaar-ui-client" }
vyapaar-ui-api-wasm = { path = "crates/vyapaar-ui-api-wasm" }
vyapaar-ui-app = { path = "crates/vyapaar-ui-app" }
vyapaar-highlight = { path = "crates/vyapaar-highlight" }
vyapaar-tui = { path = "crates/vyapaar-tui" }
vyapaar-cli = { path = "crates/vyapaar-cli" }

# External dependencies
#
# WASM-portability contract (migration-guide.md §2): the WASM crates
# (`vyapaar-ui-core`, `vyapaar-ui-assets`, `vyapaar-ui-client`,
# `vyapaar-ui-charts`, `vyapaar-ui-api-wasm`, `vyapaar-ui-app`) must NEVER
# depend on `tokio`, `ratatui`, or `crossterm`. Async/native runtime deps are
# isolated to `vyapaar-tui` and `vyapaar-cli`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# `uuid` is pulled transitively from `vyapaar-core` (v4/v5/serde). The
# `rng-getrandom` feature makes it compile on `wasm32-unknown-unknown`,
# which the WASM workstation requires (migration-guide.md §2).
uuid = { version = "1", features = ["v4", "v5", "v7", "serde", "rng-getrandom"] }
rust_decimal = "1"
schemars = { version = "0.8", features = ["derive", "chrono", "uuid1", "rust_decimal"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
futures = "0.3"
toml = "0.8"
# getrandom needs the `wasm_js` feature for wasm32-unknown-unknown; the
# feature is enabled from the WASM crates that must compile to that target.
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.test]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.prod]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
