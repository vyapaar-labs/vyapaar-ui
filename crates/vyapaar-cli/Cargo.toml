[package]
name = "vyapaar-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Vyapaar quantitative AI workstation & developer CLI implementing the Quantcept command hierarchy"

[lib]
name = "vyapaar_cli"

[[bin]]
name = "vyapaar"
path = "src/main.rs"

[dependencies]
vyapaar-core.workspace = true
vyapaar-ui-core.workspace = true
vyapaar-tui.workspace = true
vyapaar-highlight.workspace = true
vyapaar-agent-core.workspace = true
vyapaar-agent-chat.workspace = true
vyapaar-agent-llm.workspace = true
vyapaar-agent-chat-tools.workspace = true
tokio = { workspace = true, features = ["full"] }
futures.workspace = true
rust_decimal.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
async-trait = "0.1"
